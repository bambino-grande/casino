spring.application.name=kazik
server.port=${SERVER_PORT:8081}
logging.pattern.level=%5p [traceId=%X{traceId:-}]

spring.datasource.url=${KAZIK_DB_URL:jdbc:postgresql://localhost:5544/kazik}
spring.datasource.username=${KAZIK_DB_USER:kazik}
spring.datasource.password=${KAZIK_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${KAZIK_DB_POOL_SIZE:20}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/kazik/db.changelog-master.yaml

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/kazik}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/kazik/protocol/openid-connect/certs}

kazik.identity.keycloak.base-url=${KEYCLOAK_INTERNAL_URL:http://localhost:8080}
kazik.identity.keycloak.realm=kazik
kazik.identity.keycloak.client-id=kazik-identity
kazik.identity.keycloak.client-secret=${KEYCLOAK_IDENTITY_CLIENT_SECRET:}
kazik.identity.keycloak.connect-timeout=2s
kazik.identity.keycloak.read-timeout=5s

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth.client-id=kazik-swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
logging.level.org.springdoc.core.utils.SpringDocUtils=ERROR
kazik.swagger.oauth.authorization-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8080}/realms/kazik/protocol/openid-connect/auth
kazik.swagger.oauth.token-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8080}/realms/kazik/protocol/openid-connect/token

kazik.wallet.nae-balls-per-rub=1

kazik.payments.zbank.base-url=${ZBANK_BASE_URL:https://karim.top/zbank}
kazik.payments.zbank.api-key=${ZBANK_API_KEY:}
kazik.payments.zbank.account-id=${ZBANK_ACCOUNT_ID:}
kazik.payments.zbank.connect-timeout=3s
kazik.payments.zbank.read-timeout=15s
kazik.payments.sbp.phone=${SBP_PHONE:}
kazik.payments.sbp.bank=${SBP_BANK:}
kazik.payments.sbp.recipient=${SBP_RECIPIENT:}
kazik.payments.top-up.min-amount=100
kazik.payments.top-up.max-amount=50000
kazik.payments.top-up.time-to-pay=30m
kazik.payments.donation.min-amount=50
kazik.payments.donation.max-amount=100000
kazik.payments.donation.time-to-pay=30m
kazik.payments.expiry.fixed-delay=1m
kazik.payments.outbox.batch-size=50
kazik.payments.outbox.lease=30s
kazik.payments.outbox.retry-backoff=5s
kazik.payments.outbox.fixed-delay=1s
kazik.scheduling.enabled=true

kazik.games.jackpot-contribution-basis-points=200
kazik.games.jackpot-seed=1000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

kazik.rewards.images-dir=${KAZIK_PRIZES_DIR:prizes}
